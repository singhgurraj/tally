<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home-view">
      <header>
        <h1>Tally</h1>
        <p id="counter-summary" hidden></p>
        <form id="new-counter-form">
          <input type="text" id="new-counter-name" placeholder="New counter name" required maxlength="60">
          <button type="submit">Add</button>
        </form>
      </header>

      <ul id="counter-list"></ul>

      <div id="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">＋</span>
        <p>No counters yet.<br>Add one above to get started.</p>
      </div>
    </section>

    <section id="detail-view" hidden>
      <a href="#" id="back-link">&larr; All counters</a>

      <div class="detail-header">
        <span class="counter-dot large" id="detail-dot" aria-hidden="true"></span>
        <h2 id="detail-name"></h2>
      </div>

      <div class="detail-count-row">
        <button id="detail-decrement" aria-label="Decrement">&minus;</button>
        <span id="detail-count">0</span>
        <button id="detail-increment" aria-label="Increment">+</button>
      </div>

      <h3 class="history-heading">History</h3>
      <ul id="history-list"></ul>
      <p id="history-empty" hidden>No taps logged yet — use +/&minus; above.</p>
    </section>
  </main>

  <template id="counter-template">
    <li class="counter" data-id="">
      <span class="counter-dot" aria-hidden="true"></span>
      <a href="#" class="counter-name"></a>
      <div class="counter-controls">
        <button class="decrement" aria-label="Decrement">&minus;</button>
        <span class="counter-count">0</span>
        <button class="increment" aria-label="Increment">+</button>
      </div>
      <button class="remove" aria-label="Remove counter">&times;</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
